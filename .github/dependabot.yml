# Monthly update PRs for the dev tooling (npm) and the CI workflows.
# Each ecosystem is grouped into a single PR. Libraries pulled in through
# .pkgmeta externals are not covered; the packager fetches those itself.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Also bump indirect dependencies in package-lock.json, so a fix for a
    # dismissed alert on a transitive package still arrives.
    allow:
      - dependency-type: all
    groups:
      dev-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
