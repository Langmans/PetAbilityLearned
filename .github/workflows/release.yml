# Pushing a tag (e.g. v1.0.0) runs the tests, then builds the zip with
# BigWigsMods/packager, uploads it to CurseForge and attaches it to a GitHub
# release. The CurseForge upload is skipped while the CF_API_KEY secret is unset.
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager builds the changelog from the commits since the previous tag.
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
